spring:
    application:
        name: gateway-service
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
            routes:
                - id: auth-service
                  uri: lb://AUTH-SERVICE
                  predicates:
                    - Path=/api/v1/auth/**
                - id: account-service
                  uri: lb://ACCOUNT-SERVICE
                  predicates:
                    - Path=/api/v1/account/**
                - id: transaction-service
                  uri: lb://TRANSACTION-SERVICE
                  predicates:
                    - Path=/api/v1/transaction/**
    security:
        oauth2:
            resourceserver:
                jwt:
                    jwk-set-uri: http://localhost:3000/realms/micro-services/protocol/openid-connect/certs
management:

    endpoints:
        web:
            exposure:
                include: health,info,trace,prometheus
    

logging:
    level:
        "[org.springframework.cloud.gateway]": DEBUG # Sửa dòng này
        "[org.springframework.security]": DEBUG      # Sửa dòng này




                