server:
  port: 10003

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      
      # --- CẤU HÌNH CORS (THÊM MỚI: BẮT BUỘC CHO WEBSOCKET) ---
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*" # Cho phép tất cả domain (có thể thay bằng danh sách cụ thể)
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true # Cho phép gửi Cookie/Token

      routes:
        # --- CÁC SERVICE CŨ ---
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/account/**
        
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transaction/**

        # --- CÁC SERVICE MỚI (NOTIFICATION) ---
        
        # 1. Route cho API Lịch sử thông báo, đánh dấu đã đọc
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE # Tên service trên Eureka
          predicates:
            - Path=/api/v1/notification/**
        
        # 2. Route cho WebSocket (Real-time)
        - id: notification-service-ws
          uri: lb:ws://NOTIFICATION-SERVICE # LƯU Ý: Phải là 'lb:ws://'
          predicates:
            - Path=/ws/**

  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: HS256

# Custom Config
app:
  jwtSecret: "mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm" 
  jwtCookieName: springBootEcom

# Actuator & Logging
management:
  endpoints:
    web:
      exposure:
        include: health, info, trace, prometheus

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG