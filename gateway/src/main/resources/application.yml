server:
  port: 10003

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true # Tự động map route theo serviceId (tiện nhưng nên cẩn thận)
      routes:
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/api/v1/auth/**
        - id: account-service
          uri: lb://ACCOUNT-SERVICE
          predicates:
            - Path=/api/v1/account/**
        - id: transaction-service
          uri: lb://TRANSACTION-SERVICE
          predicates:
            - Path=/api/v1/transaction/**
  security:
    oauth2:
      resourceserver:
        jwt:
          jws-algorithms: HS256

# Custom Config
app:
  # LƯU Ý: Đây phải là chuỗi Base64 chuẩn.
  # Nếu bên Auth Service dùng chuỗi cũ thì giữ nguyên, nhưng đảm bảo nó decode được.
  jwtSecret: "mySecretKey123912738aopsgjnspkmndfsopkvajoirjg94gf2opfng2moknm" 
  jwtCookieName: springBootEcom

# Actuator & Logging
management:
  endpoints:
    web:
      exposure:
        include: health, info, trace, prometheus

logging:
  level:
    root: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: DEBUG
    org.springframework.security.oauth2: DEBUG # Debug sâu hơn về token